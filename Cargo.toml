[workspace]
resolver = "2"
members = [
  "crates/alkahest-text",
  "crates/alkahest-syntax",
  "crates/alkahest-lsp",
  "crates/alkahest-workspace",
  "crates/alkahest-terminal",
  "crates/alkahest-git",
  "crates/alkahest-extensions",
  "crates/alkahest-extension-api",
  "crates/alkahest-theme",
  "crates/alkahest-keymap",
  "crates/alkahest-settings",
  "crates/alkahest-db",
  "crates/alkahest-remote",
  "crates/alkahest-dap",
  "crates/alkahest-tasks",
  "crates/alkahest-update",
  "crates/alkahest-profiles",
  "crates/alkahest-auth",
  "crates/alkahest-textmate",
  "src-tauri",
  "alkahest-extension-sdk",
]
exclude = ["extensions-rust"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/Hugofsp93/alkahest"

[workspace.dependencies]
# Internal crates
alkahest-text = { path = "crates/alkahest-text" }
alkahest-syntax = { path = "crates/alkahest-syntax" }
alkahest-lsp = { path = "crates/alkahest-lsp" }
alkahest-workspace = { path = "crates/alkahest-workspace" }
alkahest-terminal = { path = "crates/alkahest-terminal" }
alkahest-git = { path = "crates/alkahest-git" }
alkahest-extensions = { path = "crates/alkahest-extensions" }
alkahest-extension-api = { path = "crates/alkahest-extension-api" }
alkahest-theme = { path = "crates/alkahest-theme" }
alkahest-keymap = { path = "crates/alkahest-keymap" }
alkahest-settings = { path = "crates/alkahest-settings" }
alkahest-db = { path = "crates/alkahest-db" }
alkahest-remote = { path = "crates/alkahest-remote" }
alkahest-extension-sdk = { path = "alkahest-extension-sdk" }
alkahest-tasks = { path = "crates/alkahest-tasks" }
alkahest-dap = { path = "crates/alkahest-dap" }
alkahest-update = { path = "crates/alkahest-update" }
alkahest-profiles = { path = "crates/alkahest-profiles" }
alkahest-auth = { path = "crates/alkahest-auth" }
alkahest-textmate = { path = "crates/alkahest-textmate" }

# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Text
ropey = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
regex = "1"
memchr = "2"

# Syntax & Language
tree-sitter = "0.24"

# File system
notify = { version = "7", features = ["macos_fsevent"] }
walkdir = "2"
globset = "0.4"
ignore = "0.4"

# Terminal
portable-pty = "0.8"
vte = "0.13"

# Git
gix = { version = "0.68", default-features = false }

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Remote
russh = "0.46"
bollard = "0.18"
tokio-tungstenite = "0.26"

# HTTP
reqwest = { version = "0.12", features = ["rustls-tls"] }

# Concurrency
crossbeam = "0.8"
dashmap = "6"
rayon = "1"
parking_lot = "0.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
